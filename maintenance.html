<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b36">
  <title>Frog Jumper — Maintenance</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#245965 0,#102b36 60%,#091c25 100%);color:#effff8;text-align:center}
    main{width:min(100%,520px);padding:32px 24px;border:2px solid #ed171f;border-radius:22px;background:#173b45;box-shadow:0 24px 70px #0008}
    .icon{font-size:52px;margin-bottom:12px}
    h1{font-size:clamp(28px,6vw,42px);line-height:1;margin:0 0 14px}
    p{font-size:17px;line-height:1.55;color:#d8eee9;margin:0}
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="icon" aria-hidden="true">🐸 🔧</div>
    <h1>Maintenance</h1>
    <p>Please wait! We're fixing bugs and adding new features.</p>
  </main>
</body>
</html>
