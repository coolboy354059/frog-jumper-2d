name: Strict browser tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-tests:
    name: Playwright regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run strict browser tests
        run: npm test

      - name: Publish regression test status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'frog-jumper/playwright',
              description: state === 'success' ? 'Playwright suite passed' : 'Playwright suite failed'
            });
