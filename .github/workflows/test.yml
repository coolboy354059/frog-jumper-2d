name: Strict browser tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  browser-tests:
    name: Playwright regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run strict browser tests
        id: browser_tests
        run: |
          set +e
          npm test > test-output.log 2>&1
          result=$?
          set -e
          cat test-output.log
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('node:fs'); const output=fs.readFileSync('test-output.log','utf8'); const failures=output.split(/\\r?\\n/).filter(line=>line.startsWith('not ok ')).map(line=>line.substring(line.indexOf(' - ')+3)); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'failures='+failures.join('; ').slice(0,120)+'\\n');"
          exit "$result"

      - name: Publish regression test status
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.browser_tests.outcome }}
          FAILED_TESTS: ${{ steps.browser_tests.outputs.failures }}
          TEST_EXIT_CODE: ${{ steps.browser_tests.outputs.exit_code }}
        with:
          script: |
            const state = process.env.TEST_OUTCOME === 'success' ? 'success' : 'failure';
            const failureDetails = (process.env.FAILED_TESTS || '').trim();
            const contextName = state === 'success'
              ? 'frog-jumper/playwright'
              : ('frog-jumper/playwright: ' + process.env.TEST_OUTCOME + ' ' + (process.env.TEST_EXIT_CODE || failureDetails || 'no test output')).slice(0, 100);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: contextName,
              description: state === 'success' ? 'Playwright suite passed' : 'Playwright suite failed; check Actions logs'
            });
