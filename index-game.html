  function cancelMultiplayerAttempt(){
    multiplayerAttemptId++;

    const socket=multiplayerSocket;multiplayerSocket=null;multiplayerConnected=false;

  async function connectToMultiplayerRoom(code,name,mode,statusElement,attemptId=multiplayerAttemptId){
    if(attemptId!==multiplayerAttemptId)return;
    const controller=multiplayerRequestController||new AbortController();
    multiplayerRequestController=controller;
    const response=await fetch(MULTIPLAYER_API+'/api/rooms/'+code+'/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,mode}),signal:controller.signal});
    const ticket=await response.json();
    if(attemptId!==multiplayerAttemptId||controller.signal.aborted)return;
    if(!response.ok)throw new Error(ticket.error||'Could not join the room.');
    multiplayerRoomCode=code;multiplayerMode=mode;multiplayerPlayers.clear();multiplayerPlayerId='';multiplayerConnected=false;
    const socketUrl=MULTIPLAYER_API.replace(/^https:/,'wss:')+'/api/rooms/'+code+'/socket?token='+encodeURIComponent(ticket.token);
    const socket=new WebSocket(socketUrl);multiplayerSocket=socket;
    socket.addEventListener('open',()=>{
      if(attemptId!==multiplayerAttemptId||multiplayerSocket!==socket){try{socket.close(1000,'Cancelled before connection');}catch(_){}return;}
      multiplayerConnected=true;
      if(statusElement&&statusElement.isConnected)statusElement.textContent='Connected! Room '+code+' is ready. Share the code with friends.';
      multiplayerRequestController=null;
      startGame(mode);
    });
    socket.addEventListener('message',event=>{
      let message;try{message=JSON.parse(event.data);}catch(_){return;}
      if(message.type==='welcome'){
        multiplayerPlayerId=message.playerId;
        multiplayerPlayers=new Map((message.players||[]).filter(p=>p.id!==multiplayerPlayerId).map(p=>[p.id,p]));
      }else if(message.type==='player-joined'||message.type==='player-updated'||message.type==='player-moved'){
        if(message.player&&message.player.id!==multiplayerPlayerId)multiplayerPlayers.set(message.player.id,message.player);
      }else if(message.type==='player-left'){multiplayerPlayers.delete(message.playerId);}
    });
    socket.addEventListener('close',()=>{
      if(multiplayerSocket!==socket)return;
      const wasConnected=multiplayerConnected;
      multiplayerSocket=null;multiplayerConnected=false;multiplayerPlayers.clear();
      if(wasConnected&&state==='playing'){
        showOverlay('multiplayerDisconnected');
      }else if(statusElement&&statusElement.isConnected){
        statusElement.textContent='Connection closed. Check your network and try again.';
        overlay.querySelectorAll('#mp-create,#mp-join').forEach(button=>button.disabled=false);
      }
    });
    socket.addEventListener('error',()=>{
      if(attemptId!==multiplayerAttemptId)return;
      if(statusElement&&statusElement.isConnected){
        statusElement.textContent='Connection failed. Check your network or room code, then try again.';
        overlay.querySelectorAll('#mp-create,#mp-join').forEach(button=>button.disabled=false);
      }
    });
  }

  function updateRobot(dt){
    if(!robot || state!=='playing') return;
    robot.stumble=Math.max(0,robot.stumble-dt);
    const current=robot.standingOn;
    robot.vx=robot.stumble>0?0:(250+Math.min(18,Math.floor(levelIndex/5)*3));
    if(robot.onGround && current){
      robot.targetIndex=Math.max(robot.targetIndex,current.id+1);
      const next=platforms[Math.min(robot.targetIndex,platforms.length-1)];
      if(robot.stumble<=0 && next && next.id>current.id){
        // Aim for the middle of the next platform instead of jumping blindly
        // near the edge. Estimate airtime from the height difference, then
        // begin the jump at the position that puts the robot over that target.
        const rise=next.y-current.y;
        const airtime=(680+Math.sqrt(680*680+4*790*rise))/1580;
        // Land near the left side to preserve runway for the following jump.
        const landingX=next.x+Math.min(8,(next.w-robot.w)*0.5);
        const latestLaunchX=current.x+current.w-robot.w-4;
        const launchX=Math.min(latestLaunchX,landingX-robot.vx*airtime);
        if(robot.x>=launchX){
          robot.vy=-680;robot.onGround=false;robot.standingOn=null;robot.y-=1;
        }
      }
    }
    const prevBottom=robot.y+robot.h;
    robot.vy=Math.min(900,robot.vy+1580*dt);
    robot.x+=robot.vx*dt;
    robot.y+=robot.vy*dt;
    robot.onGround=false;robot.standingOn=null;
    if(robot.vy>=0){
      for(const p of platforms){
        const overlapsX=robot.x+robot.w-4>p.x && robot.x+4<p.x+p.w;
        const oldTop=Math.min(p.prevY,p.y);
        if(overlapsX && prevBottom<=oldTop+12 && robot.y+robot.h>=p.y && robot.y+robot.h<=p.y+24){
          robot.y=p.y-robot.h;robot.vy=0;robot.onGround=true;robot.standingOn=p;
        }

    }
    if(robot.onGround && robot.standingOn) robot.targetIndex=Math.max(robot.targetIndex,robot.standingOn.id+1);

      // is targetIndex - 1. Recover there instead of falling back an extra platform.

  }

  function updateBossCombat(dt){
    if(gameMode!=='boss')return;
    fireCooldown=Math.max(0,fireCooldown-dt);
    bossSpeedTimer=Math.max(0,bossSpeedTimer-dt);
    for(const shot of fireProjectiles){
      shot.x+=shot.vx*dt;shot.life-=dt;
      if(shot.life<=0)continue;
      for(const enemy of enemies){
        if(!enemy.alive)continue;
        if(shot.x>=enemy.x-8&&shot.x<=enemy.x+enemy.w+8&&shot.y>=enemy.y-8&&shot.y<=enemy.y+enemy.h+8){
          enemy.alive=false;shot.life=0;particles.push(...makeBurst(shot.x,shot.y,'#ff944a',9));break;
        }

      if(shot.life>0&&boss&&boss.alive&&shot.x>=boss.x-10&&shot.x<=boss.x+boss.w+10&&shot.y>=boss.y-8&&shot.y<=boss.y+boss.h+8){
        boss.health--;shot.life=0;particles.push(...makeBurst(shot.x,shot.y,'#ffad50',12));
        if(boss.health<=0){boss.alive=false;particles.push(...makeBurst(boss.x+boss.w/2,boss.y+boss.h/2,'#c9a0ff',34));achievementNotice='BOSS DEFEATED!';achievementNoticeTime=2.2;}
      }
    }
    fireProjectiles=fireProjectiles.filter(function(shot){return shot.life>0&&shot.x>-30&&shot.x<W+cameraX+80;});
    if(boss&&boss.alive){
      boss.x+=boss.vx*dt;
      if(boss.x<boss.minX){boss.x=boss.minX;boss.vx=Math.abs(boss.vx);}
      if(boss.x>boss.maxX){boss.x=boss.maxX;boss.vx=-Math.abs(boss.vx);}
      boss.y=platforms[platforms.length-1].y-boss.h;
      const hit=player.x+player.w-5>boss.x&&player.x+5<boss.x+boss.w&&player.y+player.h>boss.y+5&&player.y+5<boss.y+boss.h;

    }

  }

  function completeLevel(){
    if(gameMode==='boss' && boss&&boss.alive)return;
    // Level and race coins become permanent only after the player reaches the portal.
    // Wallet rewards share the shop lock to prevent cross-tab lost updates.
    if(gameMode!=='infinite'&&coinsThisLevel>0)bankWalletCoins(coinsThisLevel*(equippedSkin==='car'?5:1));
    clearInputs();

  }
  function update(dt){
    if(state!=='playing')return;
    ticks++;elapsed+=dt;
    player.jumpBuffer=Math.max(player.jumpBuffer-dt,0);
    player.invulnerable=Math.max(0,player.invulnerable-dt);
    player.blink+=dt*12;

    // Move lift platforms first and carry the frog when it is standing on one.
    for(const p of platforms){
      p.prevY=p.y;
      if(p.moving){p.y=p.baseY+Math.sin(elapsed*p.moving.speed+p.moving.phase)*p.moving.amp;}
      if(player.standingOn===p && player.onGround) player.y+=p.y-p.prevY;
      if(robot && robot.standingOn===p && robot.onGround) robot.y+=p.y-p.prevY;
    }
    for(const c of coins){
      if(c.platformRef) c.y=c.platformRef.y-47;
      else if(c.platformId!==null){const p=platforms[c.platformId];if(p)c.y=p.y-47;}
    }

    const axis=(input.right?1:0)-(input.left?1:0);
    const speed=(292 + Math.min(12, Math.floor(levelIndex/5)*2))*(gameMode==='boss'&&bossSpeedTimer>0?1.65:1);
    player.vx=axis*speed;
    if(axis)player.face=axis;
    player.x+=player.vx*dt;
    if(gameMode==='infinite') player.x=Math.max(infiniteWorld?.minX||0,player.x);
    else player.x=Math.max(0,Math.min(level.platforms[level.platforms.length-1][0]+level.platforms[level.platforms.length-1][2]-player.w,player.x));

    const previousBottom=player.y+player.h;
    player.vy=Math.min(900,player.vy+1580*dt);
    player.y+=player.vy*dt;
    player.wasOnGround=player.onGround;
    player.onGround=false;
    player.standingOn=null;
    if(player.vy>=0){
      for(const p of platforms){
        const overlapsX=player.x+player.w-4>p.x && player.x+4<p.x+p.w;
        const oldTop=Math.min(p.prevY,p.y);
        if(overlapsX && previousBottom<=oldTop+12 && player.y+player.h>=p.y && player.y+player.h<=p.y+24){
          player.y=p.y-player.h;player.vy=0;player.onGround=true;player.standingOn=p;

    if(player.onGround) player.coyote=.105; else player.coyote=Math.max(0,player.coyote-dt);

      player.vy=-655;player.onGround=false;player.standingOn=null;player.coyote=0;player.jumpBuffer=0;player.y-=1;

    }

    }
    if(multiplayerSocket&&multiplayerSocket.readyState===WebSocket.OPEN&&Date.now()-multiplayerLastSent>=50){
      multiplayerLastSent=Date.now();
      try{multiplayerSocket.send(JSON.stringify({type:'move',x:player.x,y:player.y,face:player.face,levelIndex}));}catch(_){}
    }
  }

  function pollGamepad(){
    let pads=[];

      previousGamepadJump=false;previousGamepadMenu=false;previousGamepadFire=false;return;
    }
    const axisX=Number.isFinite(pad.axes?.[0])?pad.axes[0]:0;
    const left=axisX < -0.35 || !!pad.buttons?.[14]?.pressed;
    const right=axisX > 0.35 || !!pad.buttons?.[15]?.pressed;
    gamepadInput.left=left;gamepadInput.right=right;syncHorizontalInput();
    const jump=!!pad.buttons?.[0]?.pressed;
    const fire=!!pad.buttons?.[2]?.pressed;
    const menu=!!pad.buttons?.[9]?.pressed;
    if(fire&&!previousGamepadFire&&state==='playing'&&gameMode==='boss')shootFire();
    previousGamepadFire=fire;
    if(jump&&!previousGamepadJump&&state==='playing')requestJump();
    if(menu&&!previousGamepadMenu){
      if(state==='playing'){clearInputs();showOverlay('paused');}
      else if(state==='paused'){state='playing';hideOverlay();clearInputs();}

    previousGamepadJump=jump;previousGamepadMenu=menu;

    const dx=e.clientX-(rect.left+rect.width/2);
    const dy=e.clientY-(rect.top+rect.height/2);
    const distance=Math.hypot(dx,dy);
    const scale=distance>radius?radius/distance:1;
    const x=dx*scale,y=dy*scale;
    stickKnob.style.left=`calc(50% + ${x}px)`;
    stickKnob.style.top=`calc(50% + ${y}px)`;
    const deadZone=Math.max(4,rect.width*.075);
    joystickInput.left=x < -deadZone;
    joystickInput.right=x > deadZone;

  jumpBtn.addEventListener('pointerup',releaseJump);
  jumpBtn.addEventListener('pointercancel',cancelJump);
  jumpBtn.addEventListener('lostpointercapture',cancelJump);
  jumpBtn.addEventListener('contextmenu',e=>e.preventDefault());

  canvas.addEventListener('pointerdown',()=>canvas.focus({preventScroll:true}));

  setupLevel(0);
  showOverlay('menu');
  render();
})();
</script>


<!-- Keep the latest successfully loaded game available when the device is offline. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .catch(error => console.warn('Frog Jumper offline support could not start:', error));
    });
  }
</script>
</body>
</html>
