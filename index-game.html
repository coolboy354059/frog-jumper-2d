<script>
/* Crash reporter: sends game error details (no personal info) to the multiplayer worker. */
(() => {
  try {
    const CRASH_URL = 'https://frog-jumper-multiplayer-runner.teodorc2000.workers.dev/crash';
    let sent = 0;
    const report = (message, source, line, col, stack) => {
      try {
        if (sent >= 3) return;
        sent++;
        const body = JSON.stringify({
          message: String(message || 'Unknown error').slice(0, 300),
          source: String(source || '').slice(0, 200),
          line: Number(line) || 0,
          col: Number(col) || 0,
          stack: String(stack || '').slice(0, 1000),
          page: 'index-game'
        });
        fetch(CRASH_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body, keepalive: true }).catch(() => {});
      } catch (_) {}
    };
    window.addEventListener('error', e => { report(e.message, e.filename, e.lineno, e.colno, e.error && e.error.stack); });
    window.addEventListener('unhandledrejection', e => { const r = e.reason; report(r && (r.message || String(r)), '', 0, 0, r && r.stack); });
  } catch (_) {}
})();
</script>

<!-- CHANGE LOG: 2026-10-31 — Fix 42: Clear the real player's buffered jump on pause, blur, and menu transitions so it cannot fire unexpectedly after resuming. -->
<!-- CHANGE LOG: 2026-10-31 — Fix 43: Keep keyboard and joystick directions separate so releasing one input source cannot cancel the other on hybrid touch devices. -->

<!-- CHANGE LOG: 2026-11-01 — Fix 47: Vertically center mobile game menus in the game screen while preserving scrolling when an overlay is taller than the available space. -->
<!-- CHANGE LOG: 2026-11-01 — Fix 48: Center the mobile game stage and touch-control group in the available screen space, keeping the popup centered over the game. -->

<div class="maintenance-screen" id="maintenance-screen" role="status" aria-live="polite" hidden>
  <div class="maintenance-card"><div class="maintenance-icon" aria-hidden="true">🛠️🐸</div><h2>MAINTENANCE</h2><p>Please wait! We're fixing bugs and adding new features.</p></div>
</div>
<div class="app">
  <main class="cabinet" aria-label="Frog Jumper game">
    <div class="stage" id="stage">
      <canvas id="game" width="960" height="600" tabindex="0" role="img" aria-label="Frog Jumper platform game. Use arrow keys to move and space to jump."></canvas>
      <div class="stage-hud">
        <div class="boss-tools" id="boss-tools" hidden aria-label="Boss Fight tools">
          <button type="button" class="boss-tool fire" id="boss-fire" title="Fire (F or controller X)">🔥 FIRE</button>
          <button type="button" class="boss-tool" id="boss-speed" title="Go Faster power-up">⚡ GO FASTER</button>
          <button type="button" class="boss-tool" id="boss-skip" title="Skip This Level power-up">⏭ SKIP LEVEL</button>
        </div>
        <div class="room-hud" id="room-hud" hidden></div>
      </div>
      <div class="overlay" id="overlay" tabindex="-1"></div>
    </div>
    <div class="bottom-bar" id="bottom-bar">
      <button type="button" class="bar-fullscreen" id="bar-fullscreen" aria-label="Toggle fullscreen"><span class="bar-square" aria-hidden="true"></span></button>
      <button type="button" class="bar-exit" id="bar-exit" aria-label="Exit game tab">×</button>
      <div class="controls" aria-label="Touch game controls">
        <div class="joystick" id="move-stick" role="group" aria-label="Movement joystick"><span class="stick-knob" id="stick-knob"></span></div>
        <button type="button" class="control pause" id="pause-control" aria-label="Pause game" hidden>Ⅱ</button>
        <button type="button" class="control jump" id="jump-control" aria-label="Jump">⬆</button>
      </div>
    </div>
  </main>
</div>

    if(action==='unequip')return !equipped||saveShopData({...previous,[equippedKey]:defaultItem});

    const next={...previous,[equippedKey]:item.id};

    next[ownedKey]=[...previous[ownedKey],item.id];
    if(item.price===0)return saveShopData(next);
    const remaining=balance-item.price;
    if(!saveShopData({...previous,pendingPurchase:{balance:remaining,next}}))return false;

    saveShopData(debited?next:previous);

  const mathOperations=['Addition','Subtraction','Multiplication','Division'];
  let mathOperation='Addition', mathQuiz=null;

  function makeMathQuestion(operation){
    const pick=(min,max)=>min+Math.floor(Math.random()*(max-min+1));
    let a=pick(12,79), b=pick(2,19), sign='+', answer;
    if(operation==='Subtraction'){a=Math.max(a,b)+b;sign='−';answer=a-b;}
    else if(operation==='Multiplication'){a=pick(2,12);b=pick(2,12);sign='×';answer=a*b;}
    else if(operation==='Division'){b=pick(2,12);answer=pick(2,12);a=answer*b;sign='÷';}
    else answer=a+b;
    const answers=new Set([answer]);
    const offsets=[-10,-5,-4,-3,-2,-1,1,2,3,4,5,10];
    for(let i=offsets.length-1;i>0;i--){const j=pick(0,i);[offsets[i],offsets[j]]=[offsets[j],offsets[i]];}
    for(const offset of offsets){if(answers.size>=4)break;const value=answer+offset;if(value>0)answers.add(value);}
    for(let extra=11;answers.size<4;extra++)answers.add(answer+extra);
    const choices=[...answers];
    for(let i=choices.length-1;i>0;i--){const j=pick(0,i);[choices[i],choices[j]]=[choices[j],choices[i]];}
    return {prompt:a+' '+sign+' '+b,answer,choices};
  }
  function clearMathQuiz(){

  function finishMathQuiz(quiz){

  function syncMathQuizVisibility(quiz,now){
    if(document.hidden){quiz.hiddenAt??=now;return false;}

    return true;
  }
  function beginMathQuiz(){
    clearInputs();clearMathQuiz();
    const first=makeMathQuestion(mathOperation);
    let second=makeMathQuestion(mathOperation);
    while(second.prompt===first.prompt)second=makeMathQuestion(mathOperation);
    const quiz={questions:[first,second],index:0,correct:0,deadline:performance.now()+40000,feedback:'',timer:null,hiddenAt:null};
    mathQuiz=quiz;
    function tick(){
      if(quiz!==mathQuiz)return;
      const now=performance.now();
      if(!syncMathQuizVisibility(quiz,now))return;
      const seconds=Math.ceil((quiz.deadline-now)/1000);
      if(seconds<=0){quiz.feedback='Time is up.';finishMathQuiz(quiz);return;}
      const label=overlay.querySelector('[data-math-clock]');
      const text=seconds+' seconds left';
      if(label&&label.textContent!==text)label.textContent=text;
    }
    function ask(){
      const index=quiz.index,q=quiz.questions[index];
      const choose=value=>{
        if(quiz!==mathQuiz||quiz.index!==index)return;
        const now=performance.now();
        if(!syncMathQuizVisibility(quiz,now))return;
        if(now>=quiz.deadline){tick();return;}
        const correct=value===q.answer;
        if(correct)quiz.correct++;
        quiz.feedback=(correct?'Correct! ':'Answer: ')+q.prompt+' = '+q.answer+'.';
        if(++quiz.index===2){finishMathQuiz(quiz);return;}
        ask();
      };
      showOverlay('mathQuestion',{title:q.prompt+' = ?',text:
        (quiz.feedback?quiz.feedback+' ':'')+'Question '+(index+1)+' of 2 · Get one right to open the portal.',
        buttons:q.choices.map(value=>[String(value),'secondary',()=>choose(value)])});
      tick();
    }
    quiz.timer=window.setInterval(tick,250);ask();
  }

  function cancelMultiplayerAttempt(){

  async function connectToMultiplayerRoom(code,name,mode,statusElement,attemptId=multiplayerAttemptId,onConnectionFailure){
    if(attemptId!==multiplayerAttemptId)return;
    const controller=multiplayerRequestController||new AbortController();
    multiplayerRequestController=controller;
    const response=await fetch(MULTIPLAYER_API+'/api/rooms/'+code+'/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,mode,skin:equippedSkin,hat:equippedHat}),signal:controller.signal});
    const ticket=await response.json();
    if(attemptId!==multiplayerAttemptId||controller.signal.aborted)return;
    if(!response.ok)throw new Error(ticket.error||'Could not join the room.');
    multiplayerRoomCode=code;multiplayerMode=mode;multiplayerPlayers.clear();multiplayerPlayerId='';multiplayerConnected=false;
    const socketUrl=MULTIPLAYER_API.replace(/^https:/,'wss:')+'/api/rooms/'+code+'/socket?token='+encodeURIComponent(ticket.token);
    const socket=new WebSocket(socketUrl);multiplayerSocket=socket;
    let connectionOpened=false;
    let connectionFailureHandled=false;
    socket.addEventListener('open',()=>{
      if(attemptId!==multiplayerAttemptId||multiplayerSocket!==socket){try{socket.close(1000,'Cancelled before connection');}catch(_){}return;}
      connectionOpened=true;
      multiplayerConnected=true;
      if(statusElement&&statusElement.isConnected)statusElement.textContent='Connected! Room '+code+' is ready. Share the code with friends.';
      multiplayerRequestController=null;
      startGame(mode);
    });
    socket.addEventListener('message',event=>{
      if(attemptId!==multiplayerAttemptId||multiplayerSocket!==socket)return;
      let message;try{message=JSON.parse(event.data);}catch(_){return;}
      if(message.type==='welcome'){
        multiplayerPlayerId=message.playerId;
        multiplayerPlayers=new Map((message.players||[]).filter(p=>p.id!==multiplayerPlayerId).map(p=>[p.id,p]));
      }else if(message.type==='player-joined'||message.type==='player-updated'||message.type==='player-moved'){
        if(message.player&&message.player.id!==multiplayerPlayerId)multiplayerPlayers.set(message.player.id,message.player);
      }else if(message.type==='player-left'){multiplayerPlayers.delete(message.playerId);}
    });
    const handleConnectionFailure=()=>{
      if(connectionOpened||connectionFailureHandled||attemptId!==multiplayerAttemptId||multiplayerSocket!==socket)return;
      connectionFailureHandled=true;
      multiplayerConnected=false;
      multiplayerPlayers.clear();
      if(statusElement&&statusElement.isConnected)statusElement.textContent='Connection failed. Check the room code and try again.';
      if(typeof onConnectionFailure==='function')onConnectionFailure();
    };
    socket.addEventListener('close',()=>{
      if(!connectionOpened)handleConnectionFailure();
      if(multiplayerSocket===socket){
        multiplayerSocket=null;multiplayerConnected=false;multiplayerPlayers.clear();
        if(connectionOpened&&!['menu','multiplayer','shop','achievements','multiplayerDisconnected'].includes(state)){
          multiplayerRoomCode='';multiplayerPlayerId='';
          showOverlay('multiplayerDisconnected',{name,mode,code});
        }
      }
    });
    socket.addEventListener('error',handleConnectionFailure);
  }

  function updateRobot(dt){

    robot.stumble=Math.max(0,robot.stumble-dt);

    robot.vx=robot.stumble>0?0:(250+Math.min(18,Math.floor(levelIndex/5)*3));
    if(robot.onGround && current){
      robot.targetIndex=Math.max(robot.targetIndex,current.id+1);
      const next=platforms[Math.min(robot.targetIndex,platforms.length-1)];
      if(robot.stumble<=0 && next && next.id>current.id){
        // Aim for the middle of the next platform instead of jumping blindly
        // near the edge. Estimate airtime from the height difference, then
        // begin the jump at the position that puts the robot over that target.
        const rise=next.y-current.y;
        const airtime=(655+Math.sqrt(655*655+4*790*rise))/1580;
        // Land near the left side to preserve runway for the following jump.
        const landingX=next.x+Math.min(8,(next.w-robot.w)*0.5);

      const safeIndex=Math.max(0,Math.min(platforms.length-1,robot.targetIndex-1));

  async function bankWalletCoins(amount){
    if(!Number.isSafeInteger(amount)||amount<=0)return true;
    const deposit=()=>{
      const storedWallet=readStoredNumber('frogJumperWalletCoins',null);
      if(storedWallet===null||!loadShopData({strict:true,settle:true}))return false;
      const previousWallet=walletCoins;
      walletCoins=Math.min(Number.MAX_SAFE_INTEGER,storedWallet+amount);
      if(!saveWallet()){walletCoins=previousWallet;return false;}
      syncShopFromStorage();
      updateHUD();

  }

        ctx.fillStyle='#263b64';ctx.beginPath();ctx.arc(11,11,3.4,0,Math.PI*2);ctx.arc(26,11,3.4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.fillRect(10,9,2,2);ctx.fillRect(25,9,2,2);
      }
      if(equippedSkin==='longbeak'||equippedSkin==='chick'){
        ctx.fillStyle=equippedSkin==='chick'?'#e99b27':'#e99b27';ctx.strokeStyle='#9b641c';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(14,17);ctx.lineTo(23,17);ctx.lineTo(18.5,25);ctx.closePath();ctx.fill();ctx.stroke();
      }
      if(equippedSkin==='gold'){
        ctx.fillStyle='#fff9d6';ctx.beginPath();ctx.arc(18,27,2.3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffe17a';ctx.fillRect(5,6,3,2);ctx.fillRect(28,6,3,2);
      }
      if(equippedSkin==='ninja'){
        // A wrapped face mask and trailing red headband make this skin distinct.
        roundedRect(4,15,28,8,4,'#171c28','#090d14');
        ctx.fillStyle='#f4f5f2';ctx.fillRect(10,17,4,2);ctx.fillRect(22,17,4,2);
        ctx.fillStyle='#d83a4b';ctx.fillRect(4,4,28,3);
        ctx.beginPath();ctx.moveTo(30,5);ctx.lineTo(37,1);ctx.lineTo(34,10);ctx.closePath();ctx.fill();
      }
    }
    // PNG hats are positioned above the frog and can be worn with either skin.
    if(equippedHat==='black' && blackHatImage.complete && blackHatImage.naturalWidth>0){
      ctx.drawImage(blackHatImage,-4,-12,44,28);
    }else if(equippedHat==='tv' && tvHatImage.complete && tvHatImage.naturalWidth>0){
      ctx.drawImage(tvHatImage,-4,-17,44,31);
    }
    ctx.restore();
  }

  function drawBoss(){
    if(!boss||!boss.alive)return;
    const x=boss.x-cameraX;
    const y=boss.y+(reduceMotion?0:Math.sin(elapsed*3+boss.phase)*3);
    if(x<-130||x>W+130)return;
    ctx.save();
    ctx.fillStyle='#2b174f';ctx.beginPath();ctx.moveTo(x+10,y+27);ctx.lineTo(x+4,y+5);ctx.lineTo(x+28,y+18);ctx.lineTo(x+47,y+2);ctx.lineTo(x+62,y+18);ctx.lineTo(x+87,y+5);ctx.lineTo(x+84,y+34);ctx.closePath();ctx.fill();
    roundedRect(x,y+18,boss.w,boss.h-18,24,'#8d55d8','#351d66');
    roundedRect(x+9,y+23,boss.w-18,16,10,'#bd8cff');
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x+31,y+43,10,13,0,0,Math.PI*2);ctx.ellipse(x+64,y+43,10,13,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#23143d';ctx.beginPath();ctx.arc(x+34,y+46,4,0,Math.PI*2);ctx.arc(x+67,y+46,4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#351441';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x+48,y+59,13,.15,Math.PI-.15);ctx.stroke();
    roundedRect(x+3,y-13,boss.w-6,8,4,'#241333');
    roundedRect(x+3,y-13,(boss.w-6)*(boss.health/boss.maxHealth),8,4,'#ff5d78');
    ctx.restore();
  }
  function drawFireProjectiles(){
    for(const shot of fireProjectiles){
      const x=shot.x-cameraX,y=shot.y;ctx.save();ctx.translate(x,y);
      ctx.fillStyle='#ff542e';ctx.beginPath();ctx.ellipse(0,0,12,7,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffd65a';ctx.beginPath();ctx.ellipse(2,0,7,4,0,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }

  function drawRobot(){
    if(!robot || gameMode!=='race')return;
    const x=Math.round(robot.x-cameraX),y=Math.round(robot.y);
    if(x<-50||x>W+50)return;
    const bob=!reduceMotion&&robot.onGround?Math.sin(elapsed*13)*1.2:0;
    ctx.save();ctx.translate(x,y+bob);
    // Tiny silver rival robot with antenna, glowing eyes, and little wheels.
    ctx.strokeStyle='#dce8ef';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(18,8);ctx.lineTo(18,2);ctx.stroke();
    ctx.fillStyle='#ff6d85';ctx.beginPath();ctx.arc(18,2,3,0,Math.PI*2);ctx.fill();
    roundedRect(4,8,28,23,6,'#92a7b5','#405b6c');
    roundedRect(7,12,22,11,4,'#163642','#d2f7f1');
    ctx.fillStyle='#78ffdf';ctx.fillRect(10,15,4,4);ctx.fillRect(22,15,4,4);
    ctx.fillStyle='#445b69';ctx.fillRect(2,31,11,5);ctx.fillRect(23,31,11,5);
    ctx.fillStyle='#eafaff';ctx.fillRect(7,26,5,2);ctx.fillRect(24,26,5,2);
    ctx.restore();
    // The robot is identified by its appearance, without a text label.
  }
  function drawParticles(){if(reduceMotion)return;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.fillRect(p.x-cameraX,p.y,p.size,p.size);}ctx.globalAlpha=1;}
  function drawThanksgivingTurkeys(){
    const time = reduceMotion ? 0 : elapsed;
    function oval(x,y,rx,ry,angle,color){
      ctx.fillStyle=color;
      ctx.beginPath();
      ctx.ellipse(x,y,rx,ry,angle,0,Math.PI*2);
      ctx.fill();
    }
    ctx.save();
    for(let i=0;i<4;i++){
      const x=(time*(34+i*3)+120+i*258)%(W+100)-50;
      ctx.save();
      ctx.translate(x,87+i%3*34+Math.sin(time*2+i)*5);
      ctx.scale(.68+i%2*.18,.68+i%2*.18);
      for(let f=0;f<5;f++){
        const angle=(f-2)*.32;
        oval(-13-Math.cos(angle)*7,-3+Math.sin(angle)*12,13,4,angle,['#ad5029','#df8734','#884427','#e6a246','#a75029'][f]);
      }
      oval(0,1,13,8,0,'#714026');
      oval(-2,-4,6,11,-.7+Math.sin(time*8+i)*.65,'#b57643');
      oval(12,-7,5,6,0,'#ac5040');
      oval(14,-2,2,4,0,'#cb4037');
      ctx.fillStyle='#f3af42';ctx.beginPath();ctx.moveTo(16,-8);ctx.lineTo(23,-6);ctx.lineTo(16,-5);ctx.fill();
      oval(14,-9,1,1,0,'#261a19');
      ctx.restore();
    }
    ctx.restore();
  }
  function render(){
    drawBackground();
    drawThanksgivingTurkeys();
    if(achievementNoticeTime>0){
      ctx.save();ctx.font='bold 18px system-ui';ctx.textAlign='center';
      const label=achievementNotice;const width=Math.min(W-32,ctx.measureText(label).width+34);
      roundedRect((W-width)/2,16,width,42,12,'#102b36eF','#d5ff7d');
      ctx.fillStyle='#f4ffd9';ctx.fillText(label,W/2,43);ctx.restore();
    }
    for(const p of platforms)drawPlatform(p);
    drawPortal();
    for(const c of coins)drawCoin(c);
    for(const e of enemies)drawEnemy(e);
    drawBoss();
    drawFireProjectiles();
    drawParticles();
    drawRobot();
    if(player)drawPlayer();
    drawRemotePlayers();
    drawMultiplayerHud();
    // Keep the gameplay view free of extra text labels, as in the sketch.
    if(state==='paused'){
      ctx.fillStyle='#061c28a8';ctx.fillRect(0,0,W,H);
    }
  }
  function pollGamepad(){
    let pads=[];
    try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(_){pads=[];}
    const pad=Array.from(pads).find(p=>p&&p.connected);
    if(!pad){
      gamepadConnected=false;
      gamepadInput.left=false;gamepadInput.right=false;syncHorizontalInput();
      previousGamepadJump=false;previousGamepadMenu=false;previousGamepadFire=false;previousGamepadNavNext=false;previousGamepadNavPrev=false;return;
    }
    gamepadConnected=true;
    const axisX=Number.isFinite(pad.axes?.[0])?pad.axes[0]:0;
    const left=axisX < -0.35 || !!pad.buttons?.[14]?.pressed;
    const right=axisX > 0.35 || !!pad.buttons?.[15]?.pressed;
    gamepadInput.left=left;gamepadInput.right=right;syncHorizontalInput();
    const jump=!!pad.buttons?.[0]?.pressed;
    const fire=!!pad.buttons?.[2]?.pressed;
    const menu=!!pad.buttons?.[9]?.pressed;
    // Controller menu support: D-pad or left stick moves between popup buttons, A picks the focused one.
    const overlayActive=typeof overlay!=='undefined'&&overlay&&!overlay.hidden&&state!=='playing';
    if(overlayActive){
      const axisY=Number.isFinite(pad.axes?.[1])?pad.axes[1]:0;
      const navNext=!!pad.buttons?.[13]?.pressed||right||axisY>0.35;
      const navPrev=!!pad.buttons?.[12]?.pressed||left||axisY<-0.35;
      const step=(navNext&&!previousGamepadNavNext)?1:((navPrev&&!previousGamepadNavPrev)?-1:0);
      if(step){
        const focusable=Array.from(overlay.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),textarea:not(:disabled),select:not(:disabled),[tabindex]:not([tabindex="-1"])')).filter(el=>!el.hidden&&el.getAttribute('aria-hidden')!=='true');
        if(focusable.length){
          const current=focusable.indexOf(document.activeElement);
          const next=current<0?(step>0?focusable[0]:focusable[focusable.length-1]):focusable[(current+step+focusable.length)%focusable.length];
          next.focus();
        }
      }
      previousGamepadNavNext=navNext;previousGamepadNavPrev=navPrev;
      if(jump&&!previousGamepadJump){
        const active=document.activeElement;
        if(active&&overlay.contains(active)&&typeof active.click==='function')active.click();
      }
    }else{previousGamepadNavNext=false;previousGamepadNavPrev=false;}
    if(!overlayActive&&fire&&!previousGamepadFire&&state==='playing'&&gameMode==='boss')shootFire();
    previousGamepadFire=fire;
    if(!overlayActive&&jump&&!previousGamepadJump&&state==='playing')requestJump();
    if(menu&&!previousGamepadMenu){
      if(state==='playing'){clearInputs();showOverlay('paused');}
      else if(state==='paused'){state='playing';hideOverlay();clearInputs();canvas.focus({preventScroll:true});}
      else if(state==='menu')startGame('level');
    }
    previousGamepadJump=jump;previousGamepadMenu=menu;
  }
  window.addEventListener('gamepadconnected',()=>{previousGamepadJump=false;previousGamepadMenu=false;gamepadConnected=true;ensureFrameLoop();});
  window.addEventListener('gamepaddisconnected',()=>{gamepadInput.left=false;gamepadInput.right=false;syncHorizontalInput();previousGamepadJump=false;previousGamepadMenu=false;});

  function frame(now){
    rafId=0;
    if(document.hidden||(state!=='playing'&&state!=='paused'&&state!=='menu'&&(typeof overlay==='undefined'||overlay.hidden)))return;
    pollGamepad();
    if(!lastTime)lastTime=now;
    const delta=Math.min(FIXED_DT*16,Math.max(0,(now-lastTime)/1000));lastTime=now;
    if((state==='playing'||state==='menu')&&achievementNoticeTime>0)achievementNoticeTime=Math.max(0,achievementNoticeTime-delta);
    if(state==='playing'){
      accumulator+=delta;
      let count=0;
      while(accumulator+1e-9>=FIXED_DT&&count<16){update(FIXED_DT);accumulator=Math.max(0,accumulator-FIXED_DT);count++;if(state!=='playing')break;}
    }else{accumulator=0;if(state==='menu')elapsed+=delta;}
    if(state==='playing'||state==='menu'||state!==lastRenderedState){render();lastRenderedState=state;}
    if((state==='paused'||state==='menu'||(typeof overlay!=='undefined'&&!overlay.hidden))&&!document.hidden)ensureFrameLoop();
    else if(state==='playing'&&!document.hidden&&!rafId)rafId=requestAnimationFrame(frame);
  }

  document.addEventListener('keydown',e=>{
    const code=e.code;
    if(e.defaultPrevented||e.isComposing||e.altKey||e.ctrlKey||e.metaKey)return;
    const key=e.key?.toLowerCase();
    const jumpFocused=e.target?.id==='jump-control';
    if((state==='mathQuestion'||jumpFocused)&&code==='Enter'&&e.repeat){e.preventDefault();return;}
    const interactiveTarget=e.target&&typeof e.target.closest==='function'&&e.target.closest('button,a,input,textarea,select,[contenteditable="true"]');
    const useGameControls=!interactiveTarget||jumpFocused;
    if(useGameControls&&['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(code))e.preventDefault();
    if(useGameControls&&(code==='ArrowLeft'||key==='a')){heldMovementKeys.set(code,'left');keyboardInput.left=true;syncHorizontalInput();}
    if(useGameControls&&(code==='ArrowRight'||key==='d')){heldMovementKeys.set(code,'right');keyboardInput.right=true;syncHorizontalInput();}
    if(useGameControls&&(code==='Space'||code==='ArrowUp'||key==='w')&&!e.repeat)requestJump();
    if(useGameControls&&key==='f'&&!e.repeat&&gameMode==='boss')shootFire();
    if((key==='p'||code==='Escape')&&!e.repeat){if(state==='playing'){clearInputs();showOverlay('paused');}else if(state==='paused'){state='playing';hideOverlay();clearInputs();canvas.focus({preventScroll:true});}}
    if(key==='r'&&!e.repeat&&(useGameControls||['paused','gameover','won','levelComplete','robotWon'].includes(state))){
      if(state==='gameover'||state==='won')restartRun();
      else if(['playing','paused','levelComplete','robotWon'].includes(state))restartCurrentLevel();
    }
    if(code==='Enter'&&!e.repeat&&state==='menu'&&!interactiveTarget)startGame('level');
  },{passive:false});
  document.addEventListener('keyup',e=>{
    const direction=heldMovementKeys.get(e.code);
    if(!direction)return;
    heldMovementKeys.delete(e.code);
    keyboardInput[direction]=Array.from(heldMovementKeys.values()).includes(direction);
    syncHorizontalInput();
  });
  window.addEventListener('blur',clearInputs);
  document.addEventListener('visibilitychange',()=>{
    if(mathQuiz)syncMathQuizVisibility(mathQuiz,performance.now());
    if(document.hidden){clearInputs();if(state==='playing')showOverlay('paused');}
    else if(state==='playing'||state==='paused'||state==='menu'||(typeof overlay!=='undefined'&&!overlay.hidden))ensureFrameLoop();
  });

  const pauseControl=document.getElementById('pause-control');
  function syncPauseControl(){
    const canPause=touchControlsAvailable&&(state==='playing'||state==='paused');
    pauseControl.hidden=!canPause;
    const paused=state==='paused';
    pauseControl.textContent=paused?'▶':'Ⅱ';
    pauseControl.setAttribute('aria-label',paused?'Resume game':'Pause game');
  }
  pauseControl.addEventListener('click',()=>{
    if(state==='playing'){clearInputs();showOverlay('paused');}
    else if(state==='paused'){state='playing';hideOverlay();clearInputs();canvas.focus({preventScroll:true});}
  });
  const moveStick=document.getElementById('move-stick');
  const stickKnob=document.getElementById('stick-knob');
  let stickPointer=null;
  function moveJoystick(e){
    const rect=moveStick.getBoundingClientRect();
    const radius=Math.max(0,(rect.width-30)/2);
    const dx=e.clientX-(rect.left+rect.width/2);
    const dy=e.clientY-(rect.top+rect.height/2);
    const distance=Math.hypot(dx,dy);
    const scale=distance>radius?radius/distance:1;
    const x=dx*scale,y=dy*scale;
    stickKnob.style.left=`calc(50% + ${x}px)`;
    stickKnob.style.top=`calc(50% + ${y}px)`;
    const deadZone=Math.max(4,rect.width*.075);
    joystickInput.left=x < -deadZone;
    joystickInput.right=x > deadZone;
    syncHorizontalInput();
  }
  function resetJoystick(){
    const activePointer=stickPointer;
    stickPointer=null;joystickInput.left=false;joystickInput.right=false;syncHorizontalInput();
    stickKnob.style.left='50%';stickKnob.style.top='50%';
    if(activePointer!==null&&typeof moveStick.hasPointerCapture==='function'&&moveStick.hasPointerCapture(activePointer)){
      try{moveStick.releasePointerCapture(activePointer);}catch(_){}
    }
  }
  moveStick.addEventListener('pointerdown',e=>{
    if(state!=='playing'||e.button!==0||stickPointer!==null)return;e.preventDefault();stickPointer=e.pointerId;
    try{moveStick.setPointerCapture(e.pointerId);}catch(_){}moveJoystick(e);
  });
  moveStick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();moveJoystick(e);}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(type=>moveStick.addEventListener(type,e=>{if(e.pointerId===stickPointer)resetJoystick();}));
  moveStick.addEventListener('contextmenu',e=>e.preventDefault());
  const bottomBar=document.getElementById('bottom-bar');
  let bottomBarTimer=0;
  function showBottomBar(){
    bottomBar.classList.remove('is-hidden');
    window.clearTimeout(bottomBarTimer);
    if(state==='playing'&&!touchControlsAvailable) bottomBarTimer=window.setTimeout(()=>bottomBar.classList.add('is-hidden'),10000);
  }
  function noteActivity(){showBottomBar();}
  document.addEventListener('keydown',noteActivity,{passive:true});
  document.addEventListener('pointermove',noteActivity,{passive:true});
  document.addEventListener('pointerdown',noteActivity,{passive:true});
  document.getElementById('bar-fullscreen').addEventListener('click',async event=>{
    const button=event.currentTarget;
    try{
      if(document.fullscreenElement) await document.exitFullscreen();
      else if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    }catch(_){ /* Fullscreen can be blocked by browser or device policy. */ }
    if(event.detail>0&&state==='playing'&&document.activeElement===button)canvas.focus({preventScroll:true});
  });
  document.getElementById('bar-exit').addEventListener('click',()=>{
    window.clearTimeout(bottomBarTimer);
    window.close();
    // Browsers block closing tabs that were not opened by this game.
    // If blocked, leave the player at the game's menu instead.
    returnToMenu();
  });
  const jumpBtn=document.getElementById('jump-control');
  let jumpPointer=null;
  jumpBtn.addEventListener('pointerdown',e=>{
    if(e.button!==0||jumpPointer!==null||state!=='playing')return;
    e.preventDefault();jumpPointer=e.pointerId;jumpBtn.classList.add('pressed');requestJump(jumpPointer);
    try{jumpBtn.setPointerCapture(e.pointerId);}catch(_){}
  });
  const releaseJump=e=>{
    if(e)e.preventDefault();
    if(jumpPointer===null||(e&&e.pointerId!==jumpPointer))return;
    jumpPointer=null;jumpBtn.classList.remove('pressed');
  };
  const cancelJump=e=>{
    if(e)e.preventDefault();
    if(jumpPointer===null||(e&&e.pointerId!==jumpPointer))return;
    const pointer=jumpPointer;
    if(player&&player.jumpRequestPointer===pointer)player.jumpBuffer=0;
    releaseJump();
    if(jumpBtn.hasPointerCapture(pointer)){try{jumpBtn.releasePointerCapture(pointer);}catch(_){}}
  };
  jumpBtn.addEventListener('pointerup',releaseJump);
  jumpBtn.addEventListener('pointercancel',cancelJump);
  jumpBtn.addEventListener('lostpointercapture',cancelJump);
  jumpBtn.addEventListener('click',e=>{if(e.detail===0)requestJump();});
  jumpBtn.addEventListener('contextmenu',e=>e.preventDefault());

  canvas.addEventListener('pointerdown',()=>canvas.focus({preventScroll:true}));

  setupLevel(0);
  showOverlay('menu');
  render();
})();
</script>


<!-- Keep the latest successfully loaded game available when the device is offline. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .catch(error => console.warn('Frog Jumper offline support could not start:', error));
    });
  }
</script>
