<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102b36">
<title>Frog Jumper — 2D Platform Adventure</title>
<style>
  :root{color-scheme:dark;--ink:#effff8;--muted:#b8d6cc;--panel:#173b45;--panel2:#102b36;--lime:#c9ff67;--gold:#ffd65c;--line:#ffffff22}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#245965 0,#102b36 55%,#091c25 100%);color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,-apple-system,Segoe UI,sans-serif}
  .app{width:min(100%,1200px);min-height:100vh;min-height:100dvh;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
  body{padding:0}
  header{display:none}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:52px;height:52px;flex:0 0 52px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#caff7a,#6fcb52);box-shadow:inset 0 0 0 3px rgba(255,255,255,.14),0 10px 24px rgba(32,76,33,.35)}
  h1{font-size:clamp(22px,4.4vw,34px);line-height:1;margin:0;font-weight:1000;letter-spacing:-.045em}.sub{color:var(--muted);font-size:13px;margin-top:5px}
  .version{font-size:11px;font-weight:900;letter-spacing:.12em;color:#d9efbb;border:1px solid #b8dd8955;border-radius:999px;padding:8px 10px;white-space:nowrap}
  .cabinet{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none;display:flex;flex:1;min-height:0;flex-direction:column}
  .hud{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:8px;margin:0 0 10px}.stat{background:#0c2832a8;border:1px solid #ffffff15;border-radius:12px;padding:9px 12px;min-width:0}.stat label{display:block;color:#93c7b9;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.stat strong{display:block;margin-top:4px;font-size:15px;font-weight:900}
  .stage{position:relative;width:100%;flex:1;min-height:240px;overflow:hidden;border-radius:5px;background:#88dfff;outline:0;isolation:isolate}.stage canvas{display:block;width:100%;height:100%;min-height:240px}
  .overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:18px;background:#071d27bb;backdrop-filter:blur(4px);text-align:center}.overlay[hidden]{display:none}
  .overlay-card{max-width:440px;width:min(90%,420px);padding:20px 18px;border-radius:18px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(180deg,rgba(24,62,72,.96),rgba(8,22,29,.8));box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .big-frog{font-size:clamp(36px,8vw,62px);line-height:1;margin-bottom:4px}.overlay-card h2{margin:0;font-size:clamp(24px,4vw,38px);line-height:1.05;letter-spacing:-.05em}.overlay-card p{color:#d8eee9;font-size:15px;line-height:1.45;margin:12px 0 0}.button-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.action{appearance:none;border:0;border-radius:999px;padding:11px 16px;min-width:160px;font-size:12px;font-weight:900;letter-spacing:.12em;cursor:pointer;transition:transform .12s ease,filter .12s ease}.action.primary{background:linear-gradient(180deg,#dff36b,#9bd53d);color:#183515;box-shadow:0 8px 18px rgba(92,143,31,.28)}.action.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(255,255,255,.12)}.action:hover{transform:translateY(-1px)}.action:disabled{opacity:.5;cursor:not-allowed}
  .below{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:11px 2px 0;color:#c4ddd5;font-size:12px}.key{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border:1px solid #ffffff33;border-radius:7px;background:rgba(255,255,255,.06);color:var(--ink);font-weight:700}
  .shop-card{max-height:90%;overflow:auto}
  .wallet-line{font-size:18px!important;margin:8px 0 14px!important;color:#ffe28a!important}
  .shop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}
  .shop-item{min-width:0;padding:10px 7px;border:1px solid #ffffff22;border-radius:12px;background:#071d2766;display:flex;flex-direction:column;align-items:center;gap:7px}
  .shop-emoji{font-size:30px;line-height:1.2}
  .shop-item strong{font-size:13px}
  .shop-item small{font-size:10px;line-height:1.3;color:#c5ddd7;min-height:28px}
  .shop-item .action{font-size:9px;padding:9px 7px;width:100%;letter-spacing:.02em}
  .shop-item .action:disabled{opacity:.5;cursor:not-allowed}
  @media(max-width:520px){.shop-grid{grid-template-columns:1fr}.shop-item{display:grid;grid-template-columns:40px 1fr;align-items:center;text-align:left}.shop-emoji{grid-row:span 2}.shop-item small{min-height:0}.shop-item .action{grid-column:2}}
  .bottom-bar{height:76px;min-height:76px;margin-top:10px;padding:8px 10px;display:flex;align-items:center;gap:14px;background:#173b45;border-radius:10px;transition:opacity .25s ease,transform .25s ease}.bottom-bar.is-hidden{opacity:0;transform:translateY(12px);pointer-events:none}
  .bar-fullscreen,.bar-exit{height:48px;flex:0 0 48px;border:0;border-radius:5px;background:transparent;color:#ed171f;cursor:pointer;display:grid;place-items:center;padding:0}
  .bar-square{width:38px;height:38px;display:block;border:5px solid #ed171f;border-radius:3px}
  .bar-exit{font-size:40px;line-height:1;font-weight:500}
  .controls{display:none;flex:1;justify-content:space-between;align-items:center;gap:12px;margin:0;user-select:none;-webkit-user-select:none;touch-action:none}
  .joystick{position:relative;width:68px;height:68px;flex:0 0 68px;border:2px solid #ffffff9c;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff55,#163b49cc 72%);box-shadow:inset 0 0 12px rgba(255,255,255,.18)}
  .joystick::before,.joystick::after{content:"";position:absolute;background:#ffffff35;pointer-events:none}
  .joystick::before{width:1px;height:80%;left:50%;top:10%}.joystick::after{height:1px;width:80%;top:50%;left:10%}
  .stick-knob{position:absolute;left:50%;top:50%;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(145deg,#faffff,#a9c6d0);border:2px solid #ffffff8d;box-shadow:0 6px 16px rgba(0,0,0,.2)}
  .control{appearance:none;border:2px solid #ffffffc9;background:linear-gradient(180deg,#d9ff7d,#91d94e);color:#203b0b;border-radius:50%;width:64px;height:64px;flex:0 0 64px;font-size:25px;font-weight:900;cursor:pointer;box-shadow:inset 0 0 12px rgba(255,255,255,.28)}
  .control.pause{width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:linear-gradient(180deg,#e7f2f7,#afc7d1);color:#163746;font-size:19px}
  .control.pressed{transform:scale(.94);filter:brightness(.96)}
  @media(max-width:620px){.app{padding:max(7px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));border-width:8px}.stage{flex:0 0 auto;aspect-ratio:16/10;min-height:0}.stage canvas{min-height:0}}
  @media (any-pointer:coarse){.controls{display:flex}.bar-fullscreen,.bar-exit{display:none}}
  html.touch-device .controls{display:flex}
  html.touch-device .bar-fullscreen,html.touch-device .bar-exit{display:none}
  html.touch-device .stage{flex:0 0 auto;aspect-ratio:16/10;min-height:0}
  html.touch-device .stage canvas{min-height:0}
  @media(max-width:620px){.stage{flex:0 0 auto;aspect-ratio:16/10;min-height:0}.stage canvas{min-height:0}}
  @media(orientation:landscape) and (max-height:520px){html.touch-device .stage{width:min(100%,calc((100dvh - 164px)*1.6));align-self:center}html.touch-device .bottom-bar{flex:0 0 82px}}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
<body>
<div class="app">
  <main class="cabinet" aria-label="Frog Jumper game">
    <div class="stage" id="stage">
      <canvas id="game" width="960" height="600" tabindex="0" role="img" aria-label="Frog Jumper platform game. Use arrow keys to move and space to jump."></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
    <div class="bottom-bar" id="bottom-bar">
      <button type="button" class="bar-fullscreen" id="bar-fullscreen" aria-label="Toggle fullscreen"><span class="bar-square" aria-hidden="true"></span></button>
      <button type="button" class="bar-exit" id="bar-exit" aria-label="Exit game tab">×</button>
      <div class="controls" aria-label="Touch game controls">
        <div class="joystick" id="move-stick" role="group" aria-label="Movement joystick"><span class="stick-knob" id="stick-knob"></span></div>
        <button type="button" class="control pause" id="pause-control" aria-label="Pause game" hidden>Ⅱ</button>
        <button type="button" class="control jump" id="jump-control" aria-label="Jump">⬆</button>
      </div>
    </div>
  </main>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const stage = document.getElementById('stage');
  const W = canvas.width, H = canvas.height;
  const jupiterSkinImage = new Image();
  jupiterSkinImage.src = 'assets/601f2f8d-d595-494c-bd9e-6aaaf5fcdcea.png';
  const blackHatImage = new Image();
  blackHatImage.src = 'assets/black-hat.png';
  const tvHatImage = new Image();
  tvHatImage.src = 'assets/tv-hat.png';

  const PLAYER_W = 36, PLAYER_H = 36;
  const FIXED_DT = 1 / 120;
  const TOTAL_LEVELS = 35;
  const COINS_PER_LEVEL = 5;
  const TOTAL_COINS = TOTAL_LEVELS * COINS_PER_LEVEL;
  const motionPreference = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  let reduceMotion = !!(motionPreference && motionPreference.matches);
  if (motionPreference) {
    const syncMotionPreference = () => { reduceMotion = motionPreference.matches; };
    if (motionPreference.addEventListener) motionPreference.addEventListener('change', syncMotionPreference);
    else if (motionPreference.addListener) motionPreference.addListener(syncMotionPreference);
  }
  const touchControlsAvailable = !!((window.matchMedia && window.matchMedia('(any-pointer: coarse)').matches) || (navigator && navigator.maxTouchPoints > 0));
  if (touchControlsAvailable) document.documentElement.classList.add('touch-device');

  const LEVELS = [
    {name:'Froggy Fields', subtitle:'Warm up those frog legs!', sky:['#76d9ff','#d7f8ff'], hills:'#93df9d', far:'#b5efaa', ground:'#8a5b39', grass:'#59cf56', trim:'#c6ff83', accent:'#ffd65c', bottom:'#84d890', platforms:[[80,490,150],[220,465,140],[390,445,155],[560,470,150],[740,495,145]], enemies:[1,3], movers:[]},
    {name:'Lily Pad Lake', subtitle:'The lily pads are getting tricky!', sky:['#52c7ed','#c0f5f0'], hills:'#73cfa2', far:'#a0e3c8', ground:'#765b3c', grass:'#4bcbb0', trim:'#9affd8', accent:'#fffef5', bottom:'#8df0dd', platforms:[[60,500,160],[250,470,150],[440,450,155],[620,480,150],[790,450,120]], enemies:[0,2], movers:[]},
    {name:'Mystery Forest', subtitle:'Keep your eyes on the moving platforms!', sky:['#263c74','#745c9f'], hills:'#244e55', far:'#397369', ground:'#705044', grass:'#50b46a', trim:'#b9f078', accent:'#ffe38a', bottom:'#375d63', platforms:[[70,510,160],[275,500,140],[465,470,170],[660,500,140],[830,470,110]], enemies:[1,2,4], movers:[{index:2, amp:26, speed:1.3, phase:0.6}]},
    {name:'Lava Leap', subtitle:"Hot lava below. Don't miss a jump!", sky:['#5b3157','#e68064'], hills:'#653d50', far:'#9c514d', ground:'#56434b', grass:'#f58b4a', trim:'#ffd177', accent:'#ffdb4f', bottom:'#8b3c4a', platforms:[[80,500,140],[250,470,150],[430,440,165],[610,470,150],[785,500,130]], enemies:[0,2,3], movers:[{index:3, amp:24, speed:1.5, phase:1.2}]},
    {name:'Sky Frog', subtitle:'The final leap! Bring those coins home!', sky:['#529af1','#e9f7ff'], hills:'#a2c9f6', far:'#d2e7ff', ground:'#8263a9', grass:'#73df83', trim:'#d5ffab', accent:'#ffb63d', bottom:'#95d7fb', platforms:[[60,515,180],[250,490,160],[440,460,150],[620,500,150],[790,475,120]], enemies:[1,3], movers:[{index:2, amp:30, speed:1.7, phase:0.9}]}
  ];

  let state = 'menu';
  let gameMode = 'level';
  let robot = null;
  let levelIndex = 0;
  let level = LEVELS[0];
  let platforms = [];
  let coins = [];
  let enemies = [];
  let player = null;
  let cameraX = 0;
  let totalCoins = 0;
  let coinsThisLevel = 0;
  let walletCoins = 0;
  let shopData = {ownedSkins:['red'],ownedHats:[],equippedSkin:'red',equippedHat:'none'};
  let equippedSkin = 'red';
  let equippedHat = 'none';
  let lives = 3;
  let ticks = 0;
  let elapsed = 0;
  let lastTime = 0;
  let accumulator = 0;
  let rafId = 0;
  let checkpoint = {x:40,y:479};
  let particles = [];
  const input = {left:false,right:false,jumpBuffer:0};
  const keyboardInput = {left:false,right:false};
  const joystickInput = {left:false,right:false};
  function syncHorizontalInput(){input.left=keyboardInput.left||joystickInput.left;input.right=keyboardInput.right||joystickInput.right;}
  const MAX_LIVES = 3;

  function makePlayer(x, y) {
    return {x,y,w:PLAYER_W,h:PLAYER_H,vx:0,vy:0,onGround:false,standingOn:null,face:1,coyote:0,jumpBuffer:0,invulnerable:0,blink:0,wasOnGround:false};
  }
  function setupLevel(index) {
    levelIndex = index;
    level = LEVELS[levelIndex];
    elapsed = 0; ticks = 0;
    platforms = level.platforms.map((p,i)=>({id:i,x:p[0],baseY:p[1],y:p[1],w:p[2],h:20,prevY:p[1],moving:null}));
    for (const m of level.movers) {
      const p = platforms[m.index];
      if(p) p.moving={amp:m.amp,speed:m.speed,phase:m.phase};
    }
    coins = [];
    for (let i=1;i<=COINS_PER_LEVEL;i++) {
      const p = platforms[i];
      if(p) coins.push({x:p.x+p.w*0.5,y:p.y-47,baseY:p.y-47,platformId:p.id,taken:false,phase:i*1.7});
    }
    enemies=[];
    for (const idx of level.enemies) {
      const p=platforms[idx];
      if(p) enemies.push({x:p.x+24,y:p.y-24,w:30,h:24,platformId:p.id,minX:p.x+8,maxX:p.x+p.w-38,vx:(idx%2?1:-1)*(100+levelIndex*9),alive:true,phase:idx*2});
    }
    particles=[];
    player=makePlayer(54,platforms[0].y-PLAYER_H);
    robot = gameMode === 'race' ? {...makePlayer(104,platforms[0].y-PLAYER_H), targetIndex:1, falls:0, stumble:0} : null;
    checkpoint={x:54,y:platforms[0].y-PLAYER_H};
    cameraX=0;
    coinsThisLevel=0;
    updateHUD();
  }
  function startGame(mode='level'){
    gameMode = mode;
    lives=MAX_LIVES;totalCoins=0;setupLevel(0);state='playing';hideOverlay();clearInputs();canvas.focus({preventScroll:true});
    showBottomBar();
  }
  function restartCurrentLevel(){
    totalCoins = Math.max(0, totalCoins - coinsThisLevel);
    setupLevel(levelIndex);state='playing';hideOverlay();clearInputs();canvas.focus({preventScroll:true});
  }
  function restartRun(){startGame(gameMode);}
  function returnToMenu(){clearInputs();gameMode='level';robot=null;totalCoins=0;lives=MAX_LIVES;setupLevel(0);showOverlay('menu');}
  function clearInputs(){keyboardInput.left=false;keyboardInput.right=false;joystickInput.left=false;joystickInput.right=false;input.left=false;input.right=false;input.jumpBuffer=0;if(player)player.jumpBuffer=0;}
  function readStoredNumber(key, fallback = 0) {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw === null || raw.trim() === '') return fallback;
      const parsed = Number(raw);
      return Number.isSafeInteger(parsed) ? Math.max(0, parsed) : fallback;
    } catch (_) {
      return fallback;
    }
  }
  function writeStoredNumber(key, value) {
    try {
      const safeValue = Number.isFinite(value) ? Math.floor(value) : 0;
      window.localStorage.setItem(key, String(Math.min(Number.MAX_SAFE_INTEGER, Math.max(0, safeValue))));
    } catch (_) {}
  }
  function loadShopData(){const defaults={ownedSkins:['red'],ownedHats:[],equippedSkin:'red',equippedHat:'none'};return defaults;}
  function saveShopData(){}
  function saveWallet(){}
  function showShop(){state='shop';overlay.hidden=false;overlay.innerHTML='<div class="overlay-card"><div class="big-frog" aria-hidden="true">🛍️</div><h2>FROGGY SHOP</h2><p>Jupiter skin is available with the uploaded artwork.</p><div class="button-row"><button type="button" class="action ghost" id="shop-back">BACK TO MENU</button></div></div>';
    document.getElementById('shop-back').addEventListener('click',()=>showOverlay('menu'));
  }
  function updateBestCoins(){const bestLabel = document.getElementById('best-label'); if(bestLabel) bestLabel.textContent = totalCoins;}
  function updateHUD(){updateBestCoins();}
  function hideOverlay(){overlay.hidden=true;overlay.innerHTML='';}
  function showOverlay(kind){
    state=kind;
    overlay.hidden=false;
    const content={menu:{emoji:'🐸',title:'FROG JUMPER',text:'Choose your game! Level Adventure starts at Level 1 and takes you through all 35 levels. Race with Robot puts you against a speedy little bot.',buttons:[['LEVEL ADVENTURE','primary',()=>startGame('level')],['ROBOT RACE','ghost',()=>startGame('race')]]},help:{emoji:'🎮',title:'HOW TO HOP',text:'Use the arrow keys or A/D to move and Space/W/Up to jump. The game is a browser game on GitHub Pages.',buttons:[['BACK','primary',()=>showOverlay('menu')]]},paused:{emoji:'⏸️',title:'PAUSED',text:'Take a breather. Your coins and checkpoint are safe.',buttons:[['▶ RESUME','primary',()=>{state='playing';hideOverlay();clearInputs();canvas.focus({preventScroll:true});}],['MAIN MENU','ghost',()=>returnToMenu()]]},levelComplete:{emoji:'✨',title:'LEVEL COMPLETE!',text:'Nice work. Keep hopping.',buttons:[['NEXT LEVEL','primary',()=>{if(levelIndex===TOTAL_LEVELS-1){showOverlay('won');} else {setupLevel(levelIndex+1);state='playing';hideOverlay();clearInputs();}}]]},won:{emoji:'🏆',title:'FROG LEGEND!',text:'You beat the game!',buttons:[['PLAY AGAIN','primary',()=>startGame(gameMode)]]},gameover:{emoji:'💫',title:'OH, CROAK!',text:'You ran out of lives. Try again!',buttons:[['TRY AGAIN','primary',()=>restartRun()]]},robotWon:{emoji:'🤖',title:'THE ROBOT WON!',text:'The robot reached the portal first.',buttons:[['RETRY RACE','primary',()=>restartRun()]]}}[kind];
    if(!content) return;
    overlay.innerHTML=`<div class="overlay-card"><div class="big-frog" aria-hidden="true">${content.emoji}</div><h2>${content.title}</h2><p>${content.text}</p><div class="button-row">${content.buttons.map((b,i)=>`<button type="button" class="action ${b[1]==='primary'?'primary':'ghost'}" data-action="${i}">${b[0]}</button>`).join('')}</div></div>`;
    content.buttons.forEach((b,i)=>overlay.querySelector(`[data-action="${i}"]`).addEventListener('click',b[2]));
  }
  function requestJump(){if(state!=='playing'||!player)return;player.jumpBuffer=0.14;}
  function hurt(){if(player.invulnerable>0)return; lives--; updateHUD(); if(lives<=0){showOverlay('gameover');clearInputs(); return;} player.x=checkpoint.x; player.y=checkpoint.y; player.vx=0; player.vy=0; player.jumpBuffer=0; player.onGround=false; player.standingOn=null; player.invulnerable=1.65; player.coyote=0; particles.push(...makeBurst(player.x+player.w/2,player.y+player.h/2,'#ffffff',12)); }
  function makeBurst(x,y,color,count){let a=[];for(let i=0;i<count;i++){const angle=Math.random()*Math.PI*2,speed=65+Math.random()*200,life=0.45+Math.random()*0.45;a.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life,maxLife:life,size:3+Math.random()*4,color});}return a;}
  function updateRobot(dt){if(!robot || state!=='playing')return; robot.x += 150 * dt; }
  function completeLevel(){clearInputs(); if(levelIndex===TOTAL_LEVELS-1) showOverlay('won'); else showOverlay('levelComplete'); }
  function update(dt){
    if(state!=='playing')return;
    ticks++;elapsed+=dt;
    player.jumpBuffer=Math.max(player.jumpBuffer-dt,0);
    player.invulnerable=Math.max(0,player.invulnerable-dt);
    player.blink+=dt*12;
    const axis=(input.right?1:0)-(input.left?1:0);
    const speed=292;
    player.vx=axis*speed;
    if(axis)player.face=axis;
    player.x+=player.vx*dt;
    player.x=Math.max(0,Math.min(level.platforms[level.platforms.length-1][0]+level.platforms[level.platforms.length-1][2]-player.w,player.x));
    player.vy=Math.min(900,player.vy+1580*dt);
    player.y+=player.vy*dt;
    player.wasOnGround=player.onGround;
    player.onGround=false;
    player.standingOn=null;
    if(player.vy>=0){
      for(const p of platforms){
        const overlapsX=player.x+player.w-4>p.x && player.x+4<p.x+p.w;
        if(overlapsX && player.y+player.h>=p.y && player.y+player.h<=p.y+24){
          player.y=p.y-player.h;player.vy=0;player.onGround=true;player.standingOn=p;
        }
      }
    }
    if(player.onGround) player.coyote=.105; else player.coyote=Math.max(0,player.coyote-dt);
    if(player.jumpBuffer>0 && (player.onGround || player.coyote>0)){player.vy=-655;player.onGround=false;player.standingOn=null;player.coyote=0;player.jumpBuffer=0;player.y-=1;}
    for(const part of particles){part.x+=part.vx*dt;part.y+=part.vy*dt;part.vy+=340*dt;part.life-=dt;}
    particles=particles.filter(p=>p.life>0);
    const target=Math.max(0,Math.min(level.platforms[level.platforms.length-1][0]+level.platforms[level.platforms.length-1][2]-W,player.x-W*.34));
    cameraX+=(target-cameraX)*Math.min(1,dt*7.5);
    const endPlatform=platforms[platforms.length-1];
    const portalX=endPlatform.x+endPlatform.w*.68;
    const portalY=endPlatform.y-75;
    const playerCenterX=player.x+player.w/2;
    const playerCenterY=player.y+player.h/2;
    const portalOverlap=Math.abs(playerCenterX-portalX)<42&&playerCenterY>portalY-8&&playerCenterY<portalY+88;
    if(portalOverlap){completeLevel();}
  }
  function roundedRect(x,y,w,h,r,fill,stroke){const radius=Math.max(0,Math.min(Number(r)||0,Math.abs(w)/2,Math.abs(h)/2)); ctx.beginPath(); if(typeof ctx.roundRect==='function'){ctx.roundRect(x,y,w,h,radius);} else {ctx.moveTo(x+radius,y);ctx.lineTo(x+w-radius,y);ctx.arcTo(x+w,y,x+w,y+radius,radius);ctx.lineTo(x+w,y+h-radius);ctx.arcTo(x+w,y+h,x+w-radius,y+h,radius);ctx.lineTo(x+radius,y+h);ctx.arcTo(x,y+h,x,y+h-radius,radius);ctx.lineTo(x,y+radius);ctx.arcTo(x,y,x+radius,y,radius);} if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
  function drawBackground(){ctx.fillStyle='#88dfff';ctx.fillRect(0,0,W,H);}
  function drawPlatform(p){const x=p.x-cameraX; ctx.fillStyle='#8a5b39'; ctx.fillRect(x,p.y,p.w,p.h); ctx.fillStyle='#59cf56'; ctx.fillRect(x,p.y,p.w,10);}
  function drawCoin(c){if(c.taken)return; const x=c.x-cameraX; ctx.fillStyle='#ffd65c';ctx.beginPath();ctx.arc(x, c.y, 8,0,Math.PI*2);ctx.fill(); }
  function drawEnemy(e){if(!e.alive)return; const x=e.x-cameraX; ctx.fillStyle='#579b42';ctx.fillRect(x,e.y,e.w,e.h); }
  function drawPortal(){const end=platforms[platforms.length-1]; const x=end.x+end.w*.68-cameraX; ctx.fillStyle='#9e71ff'; ctx.beginPath(); ctx.ellipse(x,end.y-75,24,37,0,0,Math.PI*2); ctx.fill(); }
  function drawPlayer(){
    const blink=!reduceMotion&&player.invulnerable>0&&Math.floor(player.blink)%2===0;if(blink)return;
    const x=Math.round(player.x-cameraX),y=Math.round(player.y);
    ctx.save(); ctx.translate(x+player.w/2,y+player.h/2); ctx.scale(player.face,1); ctx.translate(-player.w/2,-player.h/2);
    if(equippedSkin==='jupiter' && jupiterSkinImage.complete && jupiterSkinImage.naturalWidth>0 && jupiterSkinImage.naturalHeight>0){
      const cropX = 520, cropY = 260, cropW = 505, cropH = 500;
      const factor = Math.min(PLAYER_W / cropW, PLAYER_H / cropH);
      const imageW = cropW * factor;
      const imageH = cropH * factor;
      const drawX = (PLAYER_W - imageW) / 2;
      const drawY = (PLAYER_H - imageH) / 2;
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(0,0,PLAYER_W,PLAYER_H,8);
      ctx.clip();
      ctx.drawImage(jupiterSkinImage, cropX, cropY, cropW, cropH, drawX, drawY, imageW, imageH);
      ctx.restore();
    } else {
      const legColor='#b51f35', bodyColor='#ef334b', outlineColor='#941b30', bellyColor='#ff9b9b', headColor='#d92743';
      roundedRect(2,20,12,14,5,legColor);roundedRect(22,20,12,14,5,legColor);
      roundedRect(3,14,30,20,10,bodyColor,outlineColor);roundedRect(8,23,20,8,4,bellyColor);
      roundedRect(4,4,11,16,5,headColor);roundedRect(21,4,11,16,5,headColor);
      ctx.fillStyle='#f9fff0';ctx.beginPath();ctx.ellipse(10,10,7,8,0,0,Math.PI*2);ctx.ellipse(26,10,7,8,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#132c32';ctx.beginPath();ctx.arc(12,11,3.2,0,Math.PI*2);ctx.arc(27,11,3.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.fillRect(11,9,2,2);ctx.fillRect(26,9,2,2);
      ctx.strokeStyle='#81172a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,21);ctx.quadraticCurveTo(18,25,23,21);ctx.stroke();
      ctx.fillStyle='#ff8a93';ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(5,21,3,0,Math.PI*2);ctx.arc(31,21,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    }
    ctx.restore();
  }
  function drawRobot(){if(!robot || gameMode!=='race')return; const x=Math.round(robot.x-cameraX),y=Math.round(robot.y); ctx.fillStyle='#92a7b5';ctx.fillRect(x,y,30,24); }
  function drawParticles(){if(reduceMotion)return;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.fillRect(p.x-cameraX,p.y,p.size,p.size);}ctx.globalAlpha=1;}
  function render(){
    drawBackground();
    for(const p of platforms)drawPlatform(p);
    drawPortal();
    for(const c of coins)drawCoin(c);
    for(const e of enemies)drawEnemy(e);
    drawParticles();
    drawRobot();
    if(player)drawPlayer();
  }
  function frame(now){
    if(!lastTime)lastTime=now;
    let delta=Math.min(.05,Math.max(0,(now-lastTime)/1000));lastTime=now;
    if(state==='playing'){accumulator+=delta;let count=0;while(accumulator>=FIXED_DT&&count<8){update(FIXED_DT);accumulator-=FIXED_DT;count++;if(state!=='playing')break;}if(count>=8)accumulator=0;}
    render();rafId=requestAnimationFrame(frame);
  }
  document.addEventListener('keydown',e=>{const code=e.code; const interactiveTarget=e.target&&typeof e.target.closest==='function'&&e.target.closest('button,a,input,textarea,select,[contenteditable="true"]'); const useGameControls=!interactiveTarget||e.target===canvas||e.target.id==='jump-control'; if(useGameControls&&['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(code))e.preventDefault(); if(useGameControls&&(code==='ArrowLeft'||code==='KeyA')){keyboardInput.left=true;syncHorizontalInput();} if(useGameControls&&(code==='ArrowRight'||code==='KeyD')){keyboardInput.right=true;syncHorizontalInput();} if(useGameControls&&(code==='Space'||code==='ArrowUp'||code==='KeyW')&&!e.repeat)requestJump(); if((code==='KeyP'||code==='Escape')&&!e.repeat){if(state==='playing'){clearInputs();showOverlay('paused');}else if(state==='paused'){state='playing';hideOverlay();clearInputs();}} if(code==='KeyR'&&!e.repeat&&!interactiveTarget){if(state==='gameover'||state==='won')restartRun(); else if(['playing','paused','levelComplete','robotWon'].includes(state))restartCurrentLevel();} if(code==='Enter'&&!e.repeat&&state==='menu'&&!interactiveTarget)startGame('level');},{passive:false});
  document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA'){keyboardInput.left=false;syncHorizontalInput();} if(e.code==='ArrowRight'||e.code==='KeyD'){keyboardInput.right=false;syncHorizontalInput();}});
  window.addEventListener('blur',clearInputs);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInputs();if(state==='playing')showOverlay('paused');}});
  const pauseControl=document.getElementById('pause-control');
  pauseControl.addEventListener('click',()=>{if(state==='playing'){clearInputs();showOverlay('paused');} else if(state==='paused'){state='playing';hideOverlay();clearInputs();canvas.focus({preventScroll:true});}});
  const moveStick=document.getElementById('move-stick');
  const stickKnob=document.getElementById('stick-knob');
  let stickPointer=null;
  function moveJoystick(e){const rect=moveStick.getBoundingClientRect();const radius=Math.max(0,(rect.width-30)/2);const dx=e.clientX-(rect.left+rect.width/2);const dy=e.clientY-(rect.top+rect.height/2);const distance=Math.hypot(dx,dy);const scale=distance>radius?radius/distance:1;const x=dx*scale,y=dy*scale;stickKnob.style.left=`calc(50% + ${x}px)`;stickKnob.style.top=`calc(50% + ${y}px)`;const deadZone=Math.max(4,rect.width*.075);joystickInput.left=x < -deadZone;joystickInput.right=x > deadZone;syncHorizontalInput();}
  function resetJoystick(){stickPointer=null;joystickInput.left=false;joystickInput.right=false;syncHorizontalInput();stickKnob.style.left='50%';stickKnob.style.top='50%';}
  moveStick.addEventListener('pointerdown',e=>{if(stickPointer!==null)return;e.preventDefault();stickPointer=e.pointerId;try{moveStick.setPointerCapture(e.pointerId);}catch(_){}moveJoystick(e);});
  moveStick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer){e.preventDefault();moveJoystick(e);}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(type=>moveStick.addEventListener(type,e=>{if(e.pointerId===stickPointer)resetJoystick();}));
  moveStick.addEventListener('contextmenu',e=>e.preventDefault());
  const bottomBar=document.getElementById('bottom-bar');
  function showBottomBar(){bottomBar.classList.remove('is-hidden');}
  document.addEventListener('keydown',()=>showBottomBar(),{passive:true});
  document.addEventListener('pointermove',()=>showBottomBar(),{passive:true});
  document.addEventListener('pointerdown',()=>showBottomBar(),{passive:true});
  document.getElementById('bar-fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement) await document.exitFullscreen(); else if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();}catch(_){}});
  document.getElementById('bar-exit').addEventListener('click',()=>{window.close();returnToMenu();});
  const jumpBtn=document.getElementById('jump-control');
  jumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();jumpBtn.classList.add('pressed');requestJump();try{jumpBtn.setPointerCapture(e.pointerId);}catch(_){};});
  const releaseJump=e=>{if(e)e.preventDefault();jumpBtn.classList.remove('pressed');};
  jumpBtn.addEventListener('pointerup',releaseJump);jumpBtn.addEventListener('pointercancel',releaseJump);jumpBtn.addEventListener('lostpointercapture',releaseJump);
  canvas.addEventListener('pointerdown',()=>canvas.focus({preventScroll:true}));
  setupLevel(0);
  showOverlay('menu');
  render();
  rafId=requestAnimationFrame(frame);
})();
</script>
